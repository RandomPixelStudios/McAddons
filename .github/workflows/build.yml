name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - run: ./scripts/server-smoke-test.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers
      - name: Client game test
        run: |
          mkdir -p fabric-26.3/build/run/clientGameTest/mcaddons/plugins
          cp -r registry/plugins/* fabric-26.3/build/run/clientGameTest/mcaddons/plugins/
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :fabric-26.3:runClientGameTest
      - uses: actions/upload-artifact@v4
        with:
          name: mcaddons
          path: |
            fabric-26.3/build/libs/*.jar
            fabric-26.3/build/run/clientGameTest/screenshots/**
